name: 正式リリース
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: 正式リリース
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/check_public.py
      - run: python scripts/check_public.py --history
      - run: python scripts/validate_translations.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      - run: python scripts/check_reproducible.py --release
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - name: 成果物を検査してリリースを作成
        run: python scripts/release.py
        env:
          GH_TOKEN: ${{ github.token }}

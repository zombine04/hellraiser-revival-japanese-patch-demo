name: 公開データの検証
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/check_public.py
      - run: python scripts/check_public.py --history
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_translations.py
      - run: python scripts/build.py --preview
      - run: python scripts/check_reproducible.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 試作配布物-${{ matrix.os }}
          path: |
            dist/*-preview.zip
            dist/*-preview.sha256
          if-no-files-found: error
          retention-days: 7
